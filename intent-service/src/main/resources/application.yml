server:
  port: 8081

spring:
  application:
    name: intent-service

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

    consumer:
      group-id: intent-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.mateusdomelo.intentservice.messaging.event.ChatMessageEvent
        spring.json.trusted.packages: "com.mateusdomelo.*"

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: validate

  datasource:
    url: jdbc:postgresql://localhost:5432/pedidos?connectTimeout=2
    username: app
    password: ${POSTGRES_PASSWORD}
    driverClassName: org.postgresql.Driver
    hikari:
      connection-timeout: 3000

resilience4j:
  circuitbreaker:
    instances:
      orderLookup:
        sliding-window-size: 2
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
app:
  topics:
    messages: chat.messages
    replies: chat.replies

logging:
  level:
    com.mateusdomelo: DEBUG

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - circuitbreakers
  endpoint:
    health:
      show-details: always